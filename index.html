<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Pano">
<meta name="theme-color" content="#07090d">
<meta name="robots" content="noindex">
<title>Pano</title>
<style>
:root{
  --metin:#f5f7fb; --soluk:rgba(245,247,251,.64); --cok-soluk:rgba(245,247,251,.38);
  --vurgu:#ffd27a; --bosluk:22px; --yaricap:28px;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;background:#07090d;color:var(--metin);overflow:hidden;
  font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display","Segoe UI",Roboto,sans-serif;
  -webkit-font-smoothing:antialiased;-webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent}
ul{list-style:none}

/* Arka plan + fotoğraflar */
#bg{position:fixed;inset:0;background:radial-gradient(120% 90% at 15% 10%,#2b3754 0%,#121826 48%,#07090d 100%)}
/* Foto ganz zeigen (nichts abschneiden); freie Fläche mit unscharfer Kopie desselben Fotos füllen */
.foto{position:absolute;inset:0;overflow:hidden;background-size:0 0;background-repeat:no-repeat;opacity:0;transition:opacity 2.4s ease}
.foto::before,.foto::after{content:"";position:absolute;background-image:inherit;background-repeat:no-repeat;background-position:center}
.foto::before{inset:-40px;background-size:cover;filter:blur(28px) brightness(.5) saturate(1.15)}
.foto::after{inset:0;background-size:contain}
/* Tablet quer + Hochformat-Foto: füllen statt kleiner Streifen; oben verankert, damit Köpfe sichtbar bleiben */
@media (min-aspect-ratio:1/1){ .foto.hoch::after{background-size:auto 150%;background-position:center 40%} }
.foto.acik{opacity:1}
#karart{position:fixed;inset:0;transition:opacity 1s,background 1s;
  background:linear-gradient(100deg,rgba(4,6,10,.66) 0%,rgba(4,6,10,.30) 52%,rgba(4,6,10,.58) 100%)}
body.gece #karart{background:rgba(0,0,0,.82)}
body.gece .foto{opacity:0!important}
/* Radio */
.radio{flex:none;display:flex;align-items:center;gap:14px;padding:14px 16px}
.r-play{flex:none;width:54px;height:54px;border-radius:50%;border:0;display:flex;align-items:center;justify-content:center;color:#0c0f16;
  background:linear-gradient(180deg,#fff,#dbe1ec);box-shadow:inset 0 1px 0 #fff,0 8px 20px -6px rgba(0,0,0,.6)}
.r-play svg{width:22px;height:22px;fill:currentColor}
.r-text{flex:1;min-width:0}
.r-name{font-size:18px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.r-status{font-size:13px;color:var(--soluk);margin-top:2px}
.radio.spielt .r-status{color:var(--vurgu)}
.r-knopf{flex:none;width:42px;height:42px;border-radius:14px;border:1px solid rgba(255,255,255,.16);background:rgba(255,255,255,.07);color:var(--metin);display:flex;align-items:center;justify-content:center}
.r-knopf svg{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.eq{display:none;align-items:flex-end;gap:3px;height:20px;flex:none}
.eq i{width:3px;height:6px;border-radius:2px;background:var(--vurgu);animation:eq 1s ease-in-out infinite alternate}
.eq i:nth-child(2){animation-delay:-.3s}.eq i:nth-child(3){animation-delay:-.6s}.eq i:nth-child(4){animation-delay:-.9s}
.radio.spielt .eq{display:flex}
@keyframes eq{from{height:4px}to{height:20px}}

/* Weihnachtslichter: schmale Lichterkette am linken und rechten Rand (innerhalb des 22-px-Randes) */
.lichter{display:none;position:fixed;top:0;bottom:0;width:22px;z-index:4;pointer-events:none;transition:opacity 1.2s}
#lichterL{left:0}#lichterR{right:0}
body.deko .lichter{display:block}
body.gece .lichter{opacity:.35}
html body.aus .lichter{opacity:0}
.lichter svg{position:absolute;inset:0;width:100%;height:100%;overflow:visible}
.lichter path{fill:none;stroke:rgba(20,40,25,.85);stroke-width:1.4}
.birne{position:absolute;width:8px;height:13px;margin:-2px 0 0 -4px;transform-origin:50% 0}
.birne::before{content:"";position:absolute;left:1px;top:0;width:6px;height:4px;border-radius:1px;background:#2b3a2e}
.birne i{position:absolute;left:0;top:3px;width:8px;height:10px;border-radius:50% 50% 50% 50%/40% 40% 60% 60%;
  background:var(--f);box-shadow:0 0 6px 2px var(--f),0 0 14px 4px var(--g);animation:funkeln var(--d) ease-in-out infinite;animation-delay:var(--v)}
@keyframes funkeln{0%,100%{opacity:1}50%{opacity:.3}}

/* Zeitplan: außerhalb der Zeit komplett schwarz (Tippen weckt 1 Minute) */
#ds,#dsRadio,#effekt{transition:opacity 1.2s}
html body.aus #pano,html body.aus #ds,html body.aus #dsRadio,html body.aus #effekt,html body.aus #durum{opacity:0!important;pointer-events:none}
html body.aus #karart{background:#000!important;opacity:1!important}

/* Wettereffekt (Regen/Schnee) über allem, aber unter der Diashow-Schrift */
#effekt{position:fixed;inset:0;width:100%;height:100%;z-index:5;pointer-events:none;display:none}

/* Diashow: Foto vollflächig, Uhr unten links, Temperatur unten rechts */
#ds{display:none;position:fixed;inset:0;z-index:6;pointer-events:none;align-items:flex-end;justify-content:space-between;
  padding:0 calc(34px + env(safe-area-inset-right)) calc(28px + env(safe-area-inset-bottom)) calc(34px + env(safe-area-inset-left));
  background:linear-gradient(0deg,rgba(0,0,0,.5) 0%,rgba(0,0,0,.18) 26%,rgba(0,0,0,0) 45%)}
body.diashow #ds{display:flex}
.ds-saat{font-size:min(13vw,112px);font-weight:200;line-height:.9;letter-spacing:-.04em;font-variant-numeric:tabular-nums;text-shadow:0 2px 24px rgba(0,0,0,.55),0 1px 3px rgba(0,0,0,.4)}
.ds-tarih{font-size:20px;font-weight:500;margin-top:8px;color:rgba(255,255,255,.88);text-shadow:0 1px 10px rgba(0,0,0,.6)}
.ds-rechts{text-align:right}
.ds-temp{display:flex;align-items:center;justify-content:flex-end;gap:.12em;font-size:min(13vw,112px);font-weight:200;line-height:.9;letter-spacing:-.04em;font-variant-numeric:tabular-nums;
  text-shadow:0 2px 24px rgba(0,0,0,.55),0 1px 3px rgba(0,0,0,.4)}
.ds-temp .ikon svg{width:.7em;height:.7em;stroke-width:1.3;filter:drop-shadow(0 2px 10px rgba(0,0,0,.5))}
.ds-tage{display:flex;justify-content:flex-end;gap:26px;margin-top:14px}
.ds-tag{text-align:center;font-size:18px;font-weight:500;text-shadow:0 1px 10px rgba(0,0,0,.65),0 1px 2px rgba(0,0,0,.5)}
.ds-tag .ad{color:rgba(255,255,255,.85)}
.ds-tag .ikon{display:flex;justify-content:center;margin:5px 0 4px}
.ds-tag .ikon svg{width:34px;height:34px;filter:drop-shadow(0 1px 6px rgba(0,0,0,.55))}
.ds-tag em{font-style:normal;color:rgba(255,255,255,.7);margin-left:5px}
/* Diashow-Elemente einzeln ausblendbar (Admin) */
body.ds-ohne-uhr .ds-uhr,body.ds-ohne-wetter .ds-temp,body.ds-ohne-tage .ds-tage{visibility:hidden}
/* Diashow-Radio: kleine Leiste oben rechts */
#dsRadio{display:none;position:fixed;z-index:7;top:calc(20px + env(safe-area-inset-top));right:calc(22px + env(safe-area-inset-right));
  align-items:center;gap:10px;padding:7px 8px 7px 7px;border-radius:999px;max-width:300px;
  background:rgba(8,10,16,.32);-webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px);border:1px solid rgba(255,255,255,.16);box-shadow:0 8px 24px -10px rgba(0,0,0,.6)}
body.diashow #dsRadio{display:flex}
body.ds-ohne-radio #dsRadio{display:none!important}
.dsr-play{flex:none;width:40px;height:40px;border-radius:50%;border:0;display:flex;align-items:center;justify-content:center;color:#0c0f16;background:linear-gradient(180deg,#fff,#dbe1ec)}
.dsr-play svg{width:17px;height:17px;fill:currentColor}
.dsr-text{min-width:0;padding-right:2px}
.dsr-name{font-size:15px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;text-shadow:0 1px 6px rgba(0,0,0,.5)}
.dsr-status{font-size:12px;color:var(--soluk)}
#dsRadio.spielt .dsr-status{color:var(--vurgu)}
.dsr-weiter{flex:none;width:34px;height:34px;border-radius:50%;border:1px solid rgba(255,255,255,.18);background:rgba(255,255,255,.08);color:var(--metin);display:flex;align-items:center;justify-content:center}
.dsr-weiter svg{width:17px;height:17px;fill:none;stroke:currentColor;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round}
body.diashow #pano [data-w]:not(.cerceve){display:none!important}
html body.diashow .sol,html body.diashow .sag{display:block!important}
body.diashow .cerceve{display:block;position:fixed;inset:0;z-index:-1;border:0;border-radius:0;box-shadow:none;background:none;-webkit-backdrop-filter:none;backdrop-filter:none}
body.diashow .cerceve::before{display:none}
body.diashow .cerceve::after{box-shadow:none;background:none}
body.diashow #karart{background:none}
body.diashow #durum{opacity:.5}

/* Bereiche ein-/ausblenden (Admin-Seite) */
body.ohne-radio .radio,body.ohne-wetter .hava,body.ohne-kalender .takvim,body.ohne-countdown .sayimlar,body.links-leer .sol,body.rechts-leer .sag{display:none!important}
body.links-leer #pano,body.rechts-leer #pano{grid-template-columns:1fr}
.sol.mitte,.sag.mitte{justify-content:center}

/* Foto-Rahmen */
.cerceve{display:none;flex:1;min-height:0;padding:0}
body.fotoVar .cerceve{display:block}
.cerceve .foto{z-index:1}
.cerceve::after{content:"";position:absolute;inset:0;z-index:3;border-radius:inherit;pointer-events:none;
  box-shadow:inset 0 1px 0 rgba(255,255,255,.4),inset 0 0 0 1px rgba(255,255,255,.12),inset 0 -40px 60px -30px rgba(0,0,0,.35)}
#tamFoto{position:fixed;inset:0;z-index:8;background:#000 center/contain no-repeat;opacity:0;pointer-events:none;transition:opacity .8s}
body.sadeceFoto #tamFoto{opacity:1}

/* Yerleşim */
#pano{position:fixed;inset:0;isolation:isolate;display:grid;grid-template-columns:1.22fr 1fr;gap:var(--bosluk);
  padding:calc(var(--bosluk) + env(safe-area-inset-top)) calc(var(--bosluk) + env(safe-area-inset-right)) calc(var(--bosluk) + env(safe-area-inset-bottom)) calc(var(--bosluk) + env(safe-area-inset-left));
  transition:transform 4s ease,opacity .8s}
.sol{display:flex;flex-direction:column;gap:18px;min-height:0}
.sag{display:flex;flex-direction:column;gap:var(--bosluk);min-height:0}

/* 3D cam */
.cam{position:relative;border-radius:var(--yaricap);padding:20px 22px;overflow:hidden;
  background:linear-gradient(155deg,rgba(255,255,255,.17) 0%,rgba(255,255,255,.06) 42%,rgba(255,255,255,.09) 100%);
  -webkit-backdrop-filter:blur(20px) saturate(150%);backdrop-filter:blur(20px) saturate(150%);
  border:1px solid rgba(255,255,255,.16);
  box-shadow:inset 0 1px 0 rgba(255,255,255,.38),inset 0 -1px 0 rgba(0,0,0,.28),0 24px 48px -12px rgba(0,0,0,.5),0 2px 6px rgba(0,0,0,.25)}
.cam::before{content:"";position:absolute;left:0;right:0;top:0;height:46%;pointer-events:none;border-radius:var(--yaricap) var(--yaricap) 0 0;
  background:linear-gradient(180deg,rgba(255,255,255,.10),rgba(255,255,255,0))}
.baslik{font-size:13px;font-weight:600;letter-spacing:.09em;text-transform:uppercase;color:var(--soluk);margin-bottom:12px}

/* Saat */
.saat{font-size:min(17.5vw,176px);font-weight:200;line-height:.86;letter-spacing:-.045em;font-variant-numeric:tabular-nums;
  text-shadow:0 6px 34px rgba(0,0,0,.4);margin-left:-6px}
.tarih{font-size:27px;font-weight:500;margin-top:10px;text-shadow:0 2px 14px rgba(0,0,0,.45)}
.tarih span{color:var(--soluk);font-weight:400}

/* Geri sayım */
.sayimlar{display:flex;gap:12px;flex-wrap:wrap}
.sayimlar:empty{display:none}
.cip{padding:11px 16px 11px 14px;border-radius:20px;display:flex;align-items:baseline;gap:8px}
.cip b{font-size:26px;font-weight:600;font-variant-numeric:tabular-nums;color:var(--vurgu)}
.cip i{font-style:normal;font-size:13px;color:var(--soluk)}
.cip span{font-size:15px;font-weight:500;max-width:190px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

/* Hava */
.hava{flex:none}
.hava-ust{display:flex;align-items:center;gap:18px}
.ikon svg{display:block;fill:none;stroke:currentColor;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}
.hava-ust .ikon svg{width:74px;height:74px}
.derece{font-size:62px;font-weight:300;line-height:1;letter-spacing:-.03em}
.durum{font-size:16px;color:var(--soluk);margin-top:4px}
.hava-yan{margin-left:auto;text-align:right;font-size:14px;line-height:1.7;color:var(--soluk)}
.hava-yan b{color:var(--metin);font-weight:500}
.gunler{display:grid;grid-template-columns:repeat(5,1fr);gap:6px;margin-top:18px;padding-top:16px;border-top:1px solid rgba(255,255,255,.12)}
.gun{text-align:center;font-size:14px}
.gun .ikon{display:flex;justify-content:center;margin:6px 0}
.gun .ikon svg{width:30px;height:30px}
.gun .ad{color:var(--soluk);font-weight:600}
.gun .mm{font-variant-numeric:tabular-nums}
.gun .mm em{font-style:normal;color:var(--cok-soluk);margin-left:5px}
.gun .yagis{font-size:12px;color:#9fd0ff;margin-top:2px;min-height:15px}

/* Takvim */
.takvim{flex:1;display:flex;flex-direction:column;min-height:0}
.ay-ust{display:flex;justify-content:space-between;align-items:baseline}
.ay{display:grid;grid-template-columns:repeat(7,1fr);gap:2px;text-align:center;font-size:13px;font-variant-numeric:tabular-nums;margin-bottom:12px}
.ay .gb{color:var(--cok-soluk);font-weight:600;font-size:11px;padding-bottom:4px}
.ay .g{position:relative;height:25px;line-height:25px;border-radius:9px}
.ay .g.diger{color:var(--cok-soluk)}
.ay .g.bugun{background:var(--metin);color:#0c0f16;font-weight:700}
.ay .g.var::after{content:"";position:absolute;left:50%;bottom:2px;width:4px;height:4px;margin-left:-2px;border-radius:50%;background:var(--vurgu)}
.ay .g.bugun.var::after{background:#0c0f16}
.liste{overflow:hidden;flex:1;-webkit-mask-image:linear-gradient(180deg,#000 82%,transparent);mask-image:linear-gradient(180deg,#000 82%,transparent)}
.etk{display:flex;gap:11px;align-items:flex-start;padding:8px 0;border-top:1px solid rgba(255,255,255,.08)}
.etk:first-child{border-top:0}
.nokta{flex:none;width:9px;height:9px;border-radius:50%;margin-top:6px;box-shadow:0 0 8px currentColor}
.etk-ad{font-size:16px;font-weight:500;line-height:1.3;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.etk-zaman{font-size:13px;color:var(--soluk);margin-top:1px}
.etk.simdi .etk-zaman{color:var(--vurgu)}
.etk > div{min-width:0}
.bos{color:var(--cok-soluk);font-size:15px;padding:6px 0}

/* Notlar */
.notlar{flex:1;display:flex;flex-direction:column;min-height:0}
.notlar ul{overflow:hidden;flex:1;-webkit-mask-image:linear-gradient(180deg,#000 80%,transparent);mask-image:linear-gradient(180deg,#000 80%,transparent)}
.notlar li{font-size:16px;line-height:1.35;padding:6px 0 6px 22px;position:relative}
.notlar li::before{content:"";position:absolute;left:0;top:10px;width:12px;height:12px;border-radius:4px;border:1.5px solid var(--soluk)}

/* Durum */
#durum{position:fixed;right:calc(14px + env(safe-area-inset-right));bottom:calc(10px + env(safe-area-inset-bottom));font-size:11px;color:var(--cok-soluk);transition:opacity .8s}
#durum.hata{color:#ffb4a8}

/* Kurulum */
#kurulum{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;padding:20px;z-index:5}
#kurulum[hidden]{display:none}
#kurulum .cam{width:100%;max-width:460px;padding:28px}
#kurulum h1{font-size:26px;font-weight:600;margin-bottom:6px}
#kurulum p{color:var(--soluk);font-size:15px;line-height:1.45;margin-bottom:18px}
#kurulum label{display:block;font-size:13px;color:var(--soluk);margin:12px 0 6px}
#kurulum input{width:100%;font:inherit;font-size:16px;color:var(--metin);padding:12px 14px;border-radius:14px;border:1px solid rgba(255,255,255,.2);background:rgba(0,0,0,.25);outline:none;-webkit-user-select:text;user-select:text}
#kurulum input:focus{border-color:rgba(255,255,255,.5)}
.dugmeler{display:flex;gap:10px;margin-top:20px}
.dugme{flex:1;font:inherit;font-size:16px;font-weight:600;padding:13px;border-radius:16px;border:1px solid rgba(255,255,255,.25);color:#0c0f16;background:linear-gradient(180deg,#fff,#dfe4ee);box-shadow:inset 0 1px 0 #fff,0 10px 24px -8px rgba(0,0,0,.6)}
.dugme.ikincil{color:var(--metin);background:rgba(255,255,255,.08)}

/* Dikey */
@media (max-aspect-ratio:1/1){
  #pano{grid-template-columns:1fr;grid-template-rows:auto minmax(0,1fr)}
  /* Hochkant: zu wenig Platz für einen Rahmen, Foto wird zum Hintergrund */
  body.fotoVar .cerceve{position:fixed;inset:0;z-index:-1;border:0;border-radius:0;box-shadow:none;background:none;-webkit-backdrop-filter:none;backdrop-filter:none}
  .cerceve::before{display:none}
  .cerceve::after{box-shadow:none;background:rgba(4,6,10,.5)}
  .saat{font-size:min(30vw,190px)}
}
</style>
</head>
<body>
<div id="bg"></div>
<div id="karart"></div>
<div id="tamFoto"></div>

<main id="pano">
  <section class="sol">
    <div data-w="uhr">
      <div class="saat" id="saat">--:--</div>
      <div class="tarih" id="tarih"></div>
    </div>
    <div class="sayimlar" id="sayimlar" data-w="countdown"></div>
    <div class="cam cerceve" id="cerceve" data-w="fotos"><div class="foto" id="fA"></div><div class="foto" id="fB"></div></div>
  </section>
  <section class="sag">
    <div class="cam hava" data-w="wetter">
      <div class="hava-ust">
        <div class="ikon" id="hIkon"></div>
        <div><div class="derece" id="hDerece">--°</div><div class="durum" id="hDurum">Wetter wird geladen</div></div>
        <div class="hava-yan" id="hYan"></div>
      </div>
      <div class="gunler" id="hGunler"></div>
    </div>
    <div class="cam takvim" data-w="kalender">
      <div class="ay-ust"><div class="baslik" id="ayAdi">Kalender</div></div>
      <div class="ay" id="ay"></div>
      <ul class="liste" id="etkinlikler"></ul>
    </div>
    <div class="cam radio" id="radio" data-w="radio">
      <button class="r-play" id="rPlay" type="button" aria-label="Radio abspielen"></button>
      <div class="r-text">
        <div class="r-name" id="rName">Radio</div>
        <div class="r-status" id="rStatus">Zum Abspielen tippen</div>
      </div>
      <div class="eq" aria-hidden="true"><i></i><i></i><i></i><i></i></div>
      <button class="r-knopf" id="rZurueck" type="button" aria-label="Vorheriger Sender"><svg viewBox="0 0 24 24"><path d="M15 6l-6 6 6 6"/></svg></button>
      <button class="r-knopf" id="rWeiter" type="button" aria-label="Nächster Sender"><svg viewBox="0 0 24 24"><path d="M9 6l6 6-6 6"/></svg></button>
    </div>
  </section>
</main>

<div class="lichter" id="lichterL" aria-hidden="true"></div>
<div class="lichter" id="lichterR" aria-hidden="true"></div>
<canvas id="effekt" aria-hidden="true"></canvas>
<div id="ds" aria-hidden="true">
  <div class="ds-uhr"><div class="ds-saat" id="dsSaat">--:--</div><div class="ds-tarih" id="dsTarih"></div></div>
  <div class="ds-rechts">
    <div class="ds-temp"><span class="ikon" id="dsIkon"></span><span id="dsTemp"></span></div>
    <div class="ds-tage" id="dsTage"></div>
  </div>
</div>
<div id="dsRadio">
  <button class="dsr-play" id="dsRPlay" type="button" aria-label="Radio abspielen"></button>
  <div class="dsr-text"><div class="dsr-name" id="dsRName">Radio</div><div class="dsr-status" id="dsRStatus"></div></div>
  <button class="dsr-weiter" id="dsRWeiter" type="button" aria-label="Nächster Sender"><svg viewBox="0 0 24 24"><path d="M9 6l6 6-6 6"/></svg></button>
</div>
<audio id="audio" preload="none" playsinline></audio>
<div id="durum"></div>

<div id="kurulum" hidden>
  <form class="cam" id="kurulumForm" autocomplete="off">
    <h1>Pano einrichten</h1>
    <p>Adresse der Apps-Script-Web-App und den Token aus dem Blatt „Einstellungen“ eingeben. Die Daten bleiben nur auf diesem Gerät.</p>
    <label for="kApi">Web-App-Adresse</label>
    <input id="kApi" type="url" placeholder="https://script.google.com/macros/s/.../exec" required>
    <label for="kKey">Token</label>
    <input id="kKey" type="text" required>
    <div class="dugmeler">
      <button type="button" class="dugme ikincil" id="kDemo">Demo</button>
      <button type="submit" class="dugme">Speichern</button>
    </div>
  </form>
</div>

<script>
(function () {
  'use strict';

  var VERSION = '13';   // bei jeder Änderung zusammen mit version.json erhöhen
  var AYAR = { veriDk: 2, havaDk: 15, fotoSn: 60, yenidenYukleSaat: 6, geceBas: 23, geceBit: 6 };
  var GUN = ['Sonntag', 'Montag', 'Dienstag', 'Mittwoch', 'Donnerstag', 'Freitag', 'Samstag'];
  var GUN_K = ['So', 'Mo', 'Di', 'Mi', 'Do', 'Fr', 'Sa'];
  var AY = ['Januar', 'Februar', 'März', 'April', 'Mai', 'Juni', 'Juli', 'August', 'September', 'Oktober', 'November', 'Dezember'];

  function $(id) { return document.getElementById(id); }
  function pad(n) { return n < 10 ? '0' + n : '' + n; }
  function enc(s) { return encodeURIComponent(s); }
  function esc(s) { return String(s).replace(/[&<>"']/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]; }); }
  var LS = {
    get: function (k) { try { return JSON.parse(localStorage.getItem('pano.' + k)); } catch (e) { return null; } },
    set: function (k, v) { try { localStorage.setItem('pano.' + k, JSON.stringify(v)); } catch (e) {} }
  };

  // Ayarlar: ?api=...&k=... bir kez okunur, cihazda saklanır.
  var q = new URLSearchParams(location.search);
  if (q.get('api')) LS.set('api', q.get('api'));
  if (q.get('k')) LS.set('k', q.get('k'));
  var DEMO = q.has('demo') || LS.get('demo') === true;
  var STANDARD_API = 'https://script.google.com/macros/s/AKfycbwcjpXKheeCJIieBHme-CYCRY0BzdEfKUcxqa97zgv4y72mJRwa99DJJK_PSiNRoGTI/exec';
  // Token dreifach merken: localStorage, Cookie und Adresse (?k=). So kennt ihn auch ein Home-Bildschirm-Symbol.
  function keksLesen() { var m = document.cookie.match(/(?:^|; )pano_k=([^;]*)/); return m ? decodeURIComponent(m[1]) : null; }
  function keksSetzen(v) { try { document.cookie = 'pano_k=' + encodeURIComponent(v) + '; max-age=315360000; path=/; secure; samesite=strict'; } catch (e) {} }
  var API = LS.get('api') || STANDARD_API, KEY = q.get('k') || LS.get('k') || keksLesen();
  if (KEY && !q.has('demo')) {
    LS.set('k', KEY); keksSetzen(KEY);
    if (!q.get('k')) try { history.replaceState(null, '', location.pathname + '?k=' + encodeURIComponent(KEY)); } catch (e) {}
  }

  function getJSON(url, sn) {
    var ctrl = window.AbortController ? new AbortController() : null;
    var t = ctrl ? setTimeout(function () { ctrl.abort(); }, (sn || 25) * 1000) : null;
    return fetch(url, ctrl ? { signal: ctrl.signal } : {}).then(function (r) {
      clearTimeout(t);
      if (!r.ok) throw new Error('HTTP ' + r.status);
      return r.json();
    });
  }

  function bugunGece() { var d = new Date(); d.setHours(0, 0, 0, 0); return d; }
  function yerelTarih(s) { var p = s.split('-'); return new Date(+p[0], +p[1] - 1, +p[2]); }
  function gunFarki(d) { var b = new Date(d); b.setHours(0, 0, 0, 0); return Math.round((b - bugunGece()) / 864e5); }
  function gunEtiketi(d) {
    var f = gunFarki(d);
    if (f <= 0) return 'Heute';
    if (f === 1) return 'Morgen';
    if (f < 7) return GUN[d.getDay()];
    return d.getDate() + '. ' + AY[d.getMonth()];
  }
  function saatYaz(d) { return pad(d.getHours()) + ':' + pad(d.getMinutes()); }

  /* Zeitplan aus der Admin-Seite (optionen.zeit_aktiv/zeit_an/zeit_aus). Ohne Zeitplan: Nachtmodus 23–6 Uhr. */
  function minuten(s) { var m = /^(\d{1,2}):(\d{2})$/.exec(s || ''); return m ? (+m[1]) * 60 + (+m[2]) : null; }
  function zeitplan(d) {
    var o = (typeof veri !== 'undefined' && veri && veri.optionen) || {};
    var jetzt = d.getHours() * 60 + d.getMinutes(), an = minuten(o.zeit_an), aus = minuten(o.zeit_aus);
    if (o.zeit_aktiv === true && an !== null && aus !== null && an !== aus) {
      var laeuft = an < aus ? (jetzt >= an && jetzt < aus) : (jetzt >= an || jetzt < aus);
      return { plan: true, aus: !laeuft };
    }
    return { plan: false, aus: d.getHours() >= AYAR.geceBas || d.getHours() < AYAR.geceBit };
  }

  /* ---------- Saat, gece modu ---------- */
  var sonGun = -1, uyanikBitis = 0;
  function saatGuncelle() {
    var d = new Date();
    $('saat').textContent = saatYaz(d);
    $('tarih').innerHTML = esc(GUN[d.getDay()]) + ' <span>' + d.getDate() + '. ' + AY[d.getMonth()] + '</span>';
    $('dsSaat').textContent = $('saat').textContent;
    $('dsTarih').textContent = GUN[d.getDay()] + ', ' + d.getDate() + '. ' + AY[d.getMonth()];
    var z = zeitplan(d);
    var schlaf = z.aus && Date.now() > uyanikBitis;
    document.body.classList.toggle('gece', schlaf);
    document.body.classList.toggle('aus', schlaf && z.plan);
    if (schlaf && z.plan && radioAn) radioStop();
    if (d.getDate() !== sonGun) { sonGun = d.getDate(); ciz(); }
    setTimeout(saatGuncelle, 1000 - d.getMilliseconds() + 20);
  }

  /* ---------- Veri ---------- */
  var veri = LS.get('veri') || { etkinlikler: [], notlar: [], sayimlar: [], fotolar: [] };

  function veriYukle() {
    if (DEMO) { veri = demoVeri(); ciz(); fotolarHazirla(); durum('Demo-Modus'); return Promise.resolve(); }
    return getJSON(API + '?k=' + enc(KEY)).then(function (v) {
      if (v.hata) throw new Error(v.hata === 'yetki' ? 'Token falsch' : v.hata);
      v.etkinlikler = (v.etkinlikler || []).filter(function (e) { return !/^Kalenderwoche \d+/.test(e.t); });
      var eskiSehir = veri.sehir;
      veri = v; LS.set('veri', v);
      ciz(); fotolarHazirla();
      if (v.sehir !== eskiSehir) havaYukle(true);
      durum('Aktualisiert ' + saatYaz(new Date()));
    }).catch(function (e) { durum('Keine Verbindung: ' + e.message, true); });
  }

  function durum(m, hata) { var el = $('durum'); el.textContent = m + ' · v' + VERSION; el.className = hata ? 'hata' : ''; }

  // Neue Version auf GitHub Pages? Dann neu laden (nicht während das Radio spielt).
  function versionPruefen() {
    if (DEMO) return;
    fetch('version.json?t=' + Date.now(), { cache: 'no-store' }).then(function (r) { return r.json(); }).then(function (j) {
      if (j && j.v && String(j.v) !== VERSION && !radioAn) {
        var p = new URLSearchParams(location.search); p.set('v', j.v);   // neuer Parameter umgeht den Browser-Cache
        location.replace(location.pathname + '?' + p.toString());
      }
    }).catch(function () {});
  }

  function ciz() { takvimCiz(); etkinlikCiz(); sayimCiz(); anzeigeAnwenden(); }

  function anzeigeAnwenden() {
    var a = veri.anzeige || {}, b = document.body.classList;
    var dia = veri.modus === 'diashow';
    if (dia !== b.contains('diashow')) { b.toggle('diashow', dia); b.remove('sadeceFoto'); fotoAnahtar = null; fotolarHazirla(); }
    ['kalender', 'wetter', 'fotos', 'countdown', 'radio'].forEach(function (n) { b.toggle('ohne-' + n, a[n] === false); });
    dekoAnwenden();
    var o = veri.optionen || {};
    ['uhr', 'wetter', 'tage', 'radio'].forEach(function (n) { b.toggle('ds-ohne-' + n, o['ds_' + n] === false); });
    var radioSichtbar = dia ? o.ds_radio !== false : a.radio !== false;
    if (!radioSichtbar && radioAn) radioStop();
    radioZeigen();
    var l = veri.layout;
    if (l && l.links && l.rechts) {
      [[l.links, '.sol'], [l.rechts, '.sag']].forEach(function (p) {
        var spalte = document.querySelector(p[1]);
        p[0].forEach(function (w) { var el = document.querySelector('[data-w="' + w + '"]'); if (el) spalte.appendChild(el); });
      });
    }
    spaltenPruefen();
  }

  // Leere Spalten ausblenden; Spalten ohne dehnbaren Bereich vertikal zentrieren.
  function spaltenPruefen() {
    var a = veri.anzeige || {}, b = document.body.classList;
    function sichtbar(w) {
      if (w === 'uhr') return true;
      if (w === 'fotos') return b.contains('fotoVar');
      if (w === 'countdown') return a.countdown !== false && $('sayimlar').children.length > 0;
      return a[w] !== false;
    }
    [['.sol', 'links-leer'], ['.sag', 'rechts-leer']].forEach(function (p) {
      var spalte = document.querySelector(p[0]);
      var ws = Array.prototype.map.call(spalte.querySelectorAll('[data-w]'), function (el) { return el.getAttribute('data-w'); });
      var sichtbare = ws.filter(sichtbar);
      b.toggle(p[1], sichtbare.length === 0);
      spalte.classList.toggle('mitte', !sichtbare.some(function (w) { return w === 'fotos' || w === 'kalender'; }));
    });
  }

  function etkinlikBaslangic(e) { return e.g ? yerelTarih(e.b) : new Date(e.b); }
  function etkinlikBitis(e) { return e.g ? yerelTarih(e.s) : new Date(e.s); }

  function takvimCiz() {
    var simdi = new Date(), y = simdi.getFullYear(), m = simdi.getMonth();
    $('ayAdi').textContent = AY[m] + ' ' + y;
    var dolu = {};
    (veri.etkinlikler || []).forEach(function (e) {
      var d = etkinlikBaslangic(e), son = etkinlikBitis(e);
      if (e.g) son = new Date(son.getTime() - 1);
      for (var i = 0; i < 40 && d <= son; i++) { dolu[d.getFullYear() + '-' + d.getMonth() + '-' + d.getDate()] = 1; d = new Date(d.getFullYear(), d.getMonth(), d.getDate() + 1); }
    });
    var ilk = new Date(y, m, 1), kayma = (ilk.getDay() + 6) % 7;
    var h = ['Mo', 'Di', 'Mi', 'Do', 'Fr', 'Sa', 'So'].map(function (g) { return '<div class="gb">' + g + '</div>'; }).join('');
    var satir = Math.ceil((kayma + new Date(y, m + 1, 0).getDate()) / 7);
    for (var i = 0; i < satir * 7; i++) {
      var d = new Date(y, m, 1 - kayma + i), c = 'g';
      if (d.getMonth() !== m) c += ' diger';
      if (d.toDateString() === simdi.toDateString()) c += ' bugun';
      if (dolu[d.getFullYear() + '-' + d.getMonth() + '-' + d.getDate()]) c += ' var';
      h += '<div class="' + c + '">' + d.getDate() + '</div>';
    }
    $('ay').innerHTML = h;
  }

  function etkinlikCiz() {
    var simdi = new Date();
    var list = (veri.etkinlikler || []).filter(function (e) { return etkinlikBitis(e) > simdi; }).slice(0, 8);
    if (!list.length) { $('etkinlikler').innerHTML = '<li class="bos">Keine anstehenden Termine</li>'; return; }
    $('etkinlikler').innerHTML = list.map(function (e) {
      var b = etkinlikBaslangic(e), s = etkinlikBitis(e);
      var devam = !e.g && b <= simdi && s > simdi;
      var gunAd = gunEtiketi(b < simdi ? simdi : b);
      var z = devam ? 'Jetzt · bis ' + saatYaz(s) + ' Uhr' : gunAd + ' · ' + (e.g ? 'Ganztägig' : saatYaz(b) + '–' + saatYaz(s));
      return '<li class="etk' + (devam ? ' simdi' : '') + '"><span class="nokta" style="background:' + esc(e.r || '#8ab4ff') + ';color:' + esc(e.r || '#8ab4ff') + '"></span>' +
        '<div><div class="etk-ad">' + esc(e.t) + '</div><div class="etk-zaman">' + esc(z) + '</div></div></li>';
    }).join('');
  }

  function sayimCiz() {
    var b = bugunGece();
    var list = (veri.sayimlar || []).map(function (x) {
      var d = yerelTarih(x.tarih);
      if (x.yillik) { d.setFullYear(b.getFullYear()); if (d < b) d.setFullYear(b.getFullYear() + 1); }
      return { ad: x.ad, gun: gunFarki(d) };
    }).filter(function (x) { return x.gun >= 0; }).sort(function (a, c) { return a.gun - c.gun; }).slice(0, 3);
    $('sayimlar').innerHTML = list.map(function (x) {
      var sayi = x.gun === 0 ? '<b>Heute</b>' : '<b>' + x.gun + '</b><i>' + (x.gun === 1 ? 'Tag' : 'Tage') + '</i>';
      return '<div class="cam cip">' + sayi + '<span>' + esc(x.ad) + '</span></div>';
    }).join('');
  }

  /* ---------- Hava durumu (Open-Meteo, anahtarsız) ---------- */
  var HAVA = {
    0: 'Klar', 1: 'Überwiegend klar', 2: 'Teilweise bewölkt', 3: 'Bedeckt', 45: 'Nebel', 48: 'Reifnebel',
    51: 'Leichter Niesel', 53: 'Niesel', 55: 'Starker Niesel', 56: 'Gefrierender Niesel', 57: 'Gefrierender Niesel',
    61: 'Leichter Regen', 63: 'Regen', 65: 'Starker Regen', 66: 'Gefrierender Regen', 67: 'Gefrierender Regen',
    71: 'Leichter Schnee', 73: 'Schnee', 75: 'Starker Schnee', 77: 'Schneegriesel', 80: 'Schauer', 81: 'Schauer', 82: 'Starke Schauer',
    85: 'Schneeschauer', 86: 'Schneeschauer', 95: 'Gewitter', 96: 'Gewitter mit Hagel', 99: 'Gewitter mit Hagel'
  };
  var BULUT = '<path d="M7 18h10a4 4 0 0 0 .6-7.96A6 6 0 0 0 6.2 11 3.5 3.5 0 0 0 7 18z"/>';
  var BULUT_UST = '<path d="M7 14.5h10a4 4 0 0 0 .6-7.96A6 6 0 0 0 6.2 7.5 3.5 3.5 0 0 0 7 14.5z"/>';
  function ikon(k, gunduz) {
    var i;
    if (k === 0 || k === 1) i = gunduz ? '<circle cx="12" cy="12" r="4.3"/><path d="M12 2.5v2M12 19.5v2M4.6 4.6l1.4 1.4M18 18l1.4 1.4M2.5 12h2M19.5 12h2M4.6 19.4L6 18M18 6l1.4-1.4"/>' : '<path d="M19.5 14.5A8 8 0 0 1 9.5 4.5a8 8 0 1 0 10 10z"/>';
    else if (k === 2) i = '<path d="M8.5 2.5v1.3M3.4 7.6H2.1M4.9 4l.9.9M13 4l-.9.9"/><path d="M5.2 10.6a3.6 3.6 0 0 1 6.6-3"/>' + '<path d="M9 20h9a3.5 3.5 0 0 0 .5-6.96A5 5 0 0 0 9 13.3 3.4 3.4 0 0 0 9 20z"/>';
    else if (k === 3) i = BULUT;
    else if (k === 45 || k === 48) i = '<path d="M4 8h16M6 12h12M4 16h16M8 20h8"/>';
    else if (k >= 71 && k <= 77 || k === 85 || k === 86) i = BULUT_UST + '<path d="M8 18v.01M12 19.5v.01M16 18v.01M10 21.5v.01M14 21.5v.01" stroke-width="2.4"/>';
    else if (k >= 95) i = BULUT_UST + '<path d="M12.5 14.5l-2.5 4h3.5l-2 4"/>';
    else if (k >= 51) i = BULUT_UST + '<path d="M8.5 17.5l-1 3M12.5 17.5l-1 3M16.5 17.5l-1 3"/>';
    else i = BULUT;
    return '<svg viewBox="0 0 24 24" aria-hidden="true">' + i + '</svg>';
  }

  function konumBul() {
    if (veri.sehir) {
      var kayit = LS.get('konum');
      if (kayit && kayit.sehir === veri.sehir) return Promise.resolve(kayit);
      return getJSON('https://geocoding-api.open-meteo.com/v1/search?count=1&language=de&name=' + enc(veri.sehir)).then(function (r) {
        if (!r.results || !r.results.length) throw new Error('Stadt nicht gefunden');
        var k = { sehir: veri.sehir, ad: r.results[0].name, lat: r.results[0].latitude, lon: r.results[0].longitude };
        LS.set('konum', k); return k;
      });
    }
    var eski = LS.get('konum');
    return new Promise(function (ok, red) {
      if (!navigator.geolocation) { return eski ? ok(eski) : red(new Error('Kein Standort')); }
      navigator.geolocation.getCurrentPosition(function (p) {
        var k = { sehir: '', ad: 'Mein Standort', lat: p.coords.latitude, lon: p.coords.longitude };
        LS.set('konum', k); ok(k);
      }, function () { eski ? ok(eski) : red(new Error('Standort nicht freigegeben')); }, { timeout: 15000, maximumAge: 36e5 });
    });
  }

  function havaYukle() {
    konumBul().then(function (k) {
      return getJSON('https://api.open-meteo.com/v1/forecast?latitude=' + k.lat + '&longitude=' + k.lon +
        '&current=temperature_2m,apparent_temperature,relative_humidity_2m,wind_speed_10m,weather_code,is_day' +
        '&daily=weather_code,temperature_2m_max,temperature_2m_min,precipitation_probability_max,sunrise,sunset' +
        '&timezone=auto&forecast_days=5').then(function (h) { h._ad = k.ad; LS.set('hava', h); havaCiz(h); });
    }).catch(function (e) {
      var eski = LS.get('hava');
      if (eski) havaCiz(eski); else $('hDurum').textContent = e.message;
    });
  }

  function havaCiz(h) {
    var c = h.current, d = h.daily;
    $('hIkon').innerHTML = ikon(c.weather_code, c.is_day);
    $('hDerece').textContent = Math.round(c.temperature_2m) + '°';
    $('dsTemp').textContent = Math.round(c.temperature_2m) + '°';
    $('dsIkon').innerHTML = ikon(c.weather_code, c.is_day);
    effektSetzen(effektArt(c.weather_code));
    $('hDurum').textContent = (HAVA[c.weather_code] || '') + ' · ' + (h._ad || '');
    var gd = d.sunrise[0] ? d.sunrise[0].slice(11, 16) : '', gb = d.sunset[0] ? d.sunset[0].slice(11, 16) : '';
    $('hYan').innerHTML = 'Gefühlt <b>' + Math.round(c.apparent_temperature) + '°</b><br>Wind <b>' + Math.round(c.wind_speed_10m) + ' km/h</b><br>Feuchte <b>' + c.relative_humidity_2m + ' %</b><br>' + gd + ' ↑ ' + gb + ' ↓';
    var g = '', ds = '';
    for (var i = 0; i < d.time.length && i < 5; i++) {
      var t = yerelTarih(d.time[i]), yg = d.precipitation_probability_max[i];
      ds += '<div class="ds-tag"><div class="ad">' + (i === 0 ? 'Heute' : GUN_K[t.getDay()]) + '</div><div class="ikon">' + ikon(d.weather_code[i], 1) + '</div>' +
        Math.round(d.temperature_2m_max[i]) + '°<em>' + Math.round(d.temperature_2m_min[i]) + '°</em></div>';
      g += '<div class="gun"><div class="ad">' + (i === 0 ? 'Heute' : GUN_K[t.getDay()]) + '</div><div class="ikon">' + ikon(d.weather_code[i], 1) + '</div>' +
        '<div class="mm">' + Math.round(d.temperature_2m_max[i]) + '°<em>' + Math.round(d.temperature_2m_min[i]) + '°</em></div>' +
        '<div class="yagis">' + (yg >= 20 ? yg + ' %' : '') + '</div></div>';
    }
    $('hGunler').innerHTML = g;
    $('dsTage').innerHTML = ds;
  }

  /* ---------- Weihnachtslichter ---------- */
  var LICHT_FARBEN = [['#ff4b4b', 'rgba(255,60,60,.45)'], ['#ffd45a', 'rgba(255,200,70,.45)'], ['#43d978', 'rgba(60,220,120,.4)'], ['#5aaeff', 'rgba(80,160,255,.45)']];
  var lichterHoehe = 0;
  function dekoSaison(d) { var m = d.getMonth(), t = d.getDate(); return m === 11 || (m === 10 && t >= 25) || (m === 0 && t <= 6); }
  function dekoAnwenden() {
    var o = veri.optionen || {};
    var an = o.deko_weihnacht === true || (o.deko_weihnacht === undefined && dekoSaison(new Date()));
    document.body.classList.toggle('deko', an);
    if (an && lichterHoehe !== innerHeight) lichterBauen();
  }
  function lichterBauen() {
    lichterHoehe = innerHeight;
    var h = innerHeight, abstand = 46, n = Math.floor((h - 20) / abstand);
    [['lichterL', 1], ['lichterR', -1]].forEach(function (s) {
      var el = $(s[0]), innen = s[1];             // innen: Richtung zur Bildschirmmitte
      var xw = innen > 0 ? 5 : 17;               // Kabel nahe am Rand
      var d = 'M' + xw + ' -5';
      for (var y = 0; y <= h + 20; y += 8) d += ' L' + (xw + Math.sin(y / abstand * Math.PI) * 3 * innen).toFixed(1) + ' ' + y;
      var html = '<svg viewBox="0 0 22 ' + h + '" preserveAspectRatio="none"><path d="' + d + '"/></svg>';
      for (var i = 0; i < n; i++) {
        var y2 = 22 + i * abstand + (abstand / 2) * 0, x2 = xw + Math.sin(y2 / abstand * Math.PI) * 3 * innen;
        var f = LICHT_FARBEN[(i + (innen > 0 ? 0 : 2)) % LICHT_FARBEN.length];
        var winkel = innen > 0 ? -60 : 60;       // Birne hängt schräg nach innen
        html += '<span class="birne" style="left:' + x2.toFixed(1) + 'px;top:' + y2 + 'px;transform:rotate(' + winkel + 'deg);--f:' + f[0] + ';--g:' + f[1] +
          ';--d:' + (2 + (i % 3) * 0.7).toFixed(1) + 's;--v:-' + ((i * 0.37) % 2.4).toFixed(2) + 's"><i></i></span>';
      }
      el.innerHTML = html;
    });
  }
  window.addEventListener('resize', function () { if (document.body.classList.contains('deko')) lichterBauen(); });

  /* ---------- Wettereffekt: Regen / Schnee (Canvas, ~30 fps, wenige Teilchen) ---------- */
  var cv = $('effekt'), ctx = cv.getContext && cv.getContext('2d');
  var effekt = { art: null, teile: [], raf: 0, letzte: 0 };
  function effektArt(k) {
    if ((k >= 71 && k <= 77) || k === 85 || k === 86) return 'schnee';
    if ((k >= 51 && k <= 67) || (k >= 80 && k <= 82) || k >= 95) return 'regen';
    return null;
  }
  function effektGroesse() {
    var dpr = Math.min(window.devicePixelRatio || 1, 2);
    cv.width = Math.round(innerWidth * dpr); cv.height = Math.round(innerHeight * dpr);
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  }
  function neuesTeil(irgendwo) {
    var w = innerWidth, h = innerHeight, r = Math.random;
    if (effekt.art === 'regen') return { x: r() * w * 1.15 - w * 0.05, y: irgendwo ? r() * h : -30 - r() * 60, l: 14 + r() * 16, v: 750 + r() * 450 };
    return { x: r() * w, y: irgendwo ? r() * h : -10 - r() * 40, g: 1.3 + r() * 2.7, v: 28 + r() * 46, p: r() * 6.28, s: 0.6 + r() * 1.2 };
  }
  function effektSetzen(art) {
    if (!ctx) return;
    var z = q.get('effekt'); if (z) art = z === 'aus' ? null : z;   // Vorschau: ?effekt=regen|schnee|aus
    if (art === effekt.art) return;
    effekt.art = art; cancelAnimationFrame(effekt.raf); effekt.teile = []; effekt.letzte = 0;
    if (!art) { cv.style.display = 'none'; return; }
    cv.style.display = 'block'; effektGroesse();
    var n = art === 'regen' ? 110 : 70;
    for (var i = 0; i < n; i++) effekt.teile.push(neuesTeil(true));
    effekt.raf = requestAnimationFrame(effektSchritt);
  }
  function effektSchritt(t) {
    effekt.raf = requestAnimationFrame(effektSchritt);
    if (effekt.letzte && t - effekt.letzte < 32) return;
    var dt = effekt.letzte ? Math.min(0.1, (t - effekt.letzte) / 1000) : 0;
    effekt.letzte = t;
    var w = innerWidth, h = innerHeight;
    ctx.clearRect(0, 0, w, h);
    if (document.body.classList.contains('gece') || document.hidden) return;
    var i, p;
    if (effekt.art === 'regen') {
      ctx.strokeStyle = 'rgba(210,226,255,.5)'; ctx.lineWidth = 1.4; ctx.lineCap = 'round';
      ctx.beginPath();
      for (i = 0; i < effekt.teile.length; i++) {
        p = effekt.teile[i];
        p.y += p.v * dt; p.x -= p.v * dt * 0.12;
        if (p.y > h + 30) effekt.teile[i] = p = neuesTeil(false);
        ctx.moveTo(p.x, p.y); ctx.lineTo(p.x + p.l * 0.12, p.y - p.l);
      }
      ctx.stroke();
    } else {
      ctx.fillStyle = 'rgba(255,255,255,.82)';
      ctx.beginPath();
      for (i = 0; i < effekt.teile.length; i++) {
        p = effekt.teile[i];
        p.p += dt * p.s; p.y += p.v * dt; p.x += Math.sin(p.p) * 18 * dt;
        if (p.y > h + 10) effekt.teile[i] = p = neuesTeil(false);
        ctx.moveTo(p.x + p.g, p.y); ctx.arc(p.x, p.y, p.g, 0, 6.283);
      }
      ctx.fill();
    }
  }
  window.addEventListener('resize', function () { if (effekt.art) effektGroesse(); });

  /* ---------- Fotoğraflar ---------- */
  var fotoSira = [], fotoIdx = -1, aktif = 'fA', fotoZamanlayici = null, fotoAnahtar = '';
  function fotolarHazirla() {
    // In der Diashow werden Fotos immer gezeigt, auch wenn "Fotos" im Standard-Modus aus ist.
    var aus = veri.anzeige && veri.anzeige.fotos === false && veri.modus !== 'diashow';
    var list = aus ? [] : (veri.fotolar || []).slice();
    var anahtar = list.join(',');
    if (anahtar === fotoAnahtar) return;
    fotoAnahtar = anahtar;
    for (var i = list.length - 1; i > 0; i--) { var j = Math.floor(Math.random() * (i + 1)), t = list[i]; list[i] = list[j]; list[j] = t; }
    fotoSira = list; fotoIdx = -1;
    document.body.classList.toggle('fotoVar', list.length > 0);
    spaltenPruefen();
    clearInterval(fotoZamanlayici);
    if (!list.length) return;
    sonrakiFoto();
    fotoZamanlayici = setInterval(sonrakiFoto, AYAR.fotoSn * 1000);
  }
  function sonrakiFoto() {
    if (!fotoSira.length || document.body.classList.contains('gece')) return;
    fotoIdx = (fotoIdx + 1) % fotoSira.length;
    var id = fotoSira[fotoIdx];
    var yukle = DEMO ? Promise.resolve({ url: id }) : getJSON(API + '?k=' + enc(KEY) + '&foto=' + enc(id), 60).then(function (r) {
      if (!r.data) throw new Error('foto'); return { url: 'data:' + r.mime + ';base64,' + r.data };
    });
    yukle.then(function (r) {
      var img = new Image();
      img.onload = function () {
        var yeni = $(aktif === 'fA' ? 'fB' : 'fA'), eski = $(aktif);
        yeni.style.zIndex = 2; eski.style.zIndex = 1;
        yeni.classList.toggle('hoch', img.naturalHeight > img.naturalWidth);
        yeni.style.backgroundImage = 'url("' + r.url + '")';
        requestAnimationFrame(function () { yeni.classList.add('acik'); });
        setTimeout(function () { eski.classList.remove('acik'); eski.style.backgroundImage = ''; }, 2600);
        aktif = yeni.id;
      };
      img.src = r.url;
    }).catch(function () {});
  }

  /* ---------- Radio ---------- */
  var RADIO_STANDARD = [
    { name: 'NDR 2', url: 'https://icecast.ndr.de/ndr/ndr2/niedersachsen/mp3/128/stream.mp3' },
    { name: 'NDR 1 Niedersachsen', url: 'https://icecast.ndr.de/ndr/ndr1niedersachsen/braunschweig/mp3/128/stream.mp3' },
    { name: 'radio ffn', url: 'https://stream.ffn.de/ffn/mp3-192/stream.mp3' },
    { name: 'Power Türk', url: 'https://listen.powerapp.com.tr/powerturk/mpeg/icecast.audio' },
    { name: 'Joy Türk', url: 'https://playerservices.streamtheworld.com/api/livestream-redirect/JOY_TURK.mp3' },
    { name: 'Deutschlandfunk', url: 'https://st01.sslstream.dlf.de/dlf/01/128/mp3/stream.mp3' }
  ];
  var PLAY = '<svg viewBox="0 0 24 24"><path d="M8 5.5v13a1 1 0 0 0 1.5.86l10.5-6.5a1 1 0 0 0 0-1.72L9.5 4.64A1 1 0 0 0 8 5.5z"/></svg>';
  var STOP = '<svg viewBox="0 0 24 24"><rect x="6" y="6" width="12" height="12" rx="2.5"/></svg>';
  var audio = $('audio'), radioAn = false, radioNeu = null, radioVersuch = 0, radioIdx = LS.get('radioIdx') || 0;
  function sender() { return veri.radio && veri.radio.length ? veri.radio : RADIO_STANDARD; }
  function radioStatus(t) { $('rStatus').textContent = t; $('dsRStatus').textContent = t; }
  function radioZeigen() {
    var l = sender();
    if (radioIdx >= l.length) radioIdx = 0;
    $('rName').textContent = l[radioIdx].name; $('dsRName').textContent = l[radioIdx].name;
    $('rPlay').innerHTML = radioAn ? STOP : PLAY; $('dsRPlay').innerHTML = radioAn ? STOP : PLAY;
    $('rPlay').setAttribute('aria-label', radioAn ? 'Radio stoppen' : 'Radio abspielen');
    $('dsRPlay').setAttribute('aria-label', radioAn ? 'Radio stoppen' : 'Radio abspielen');
    if (!radioAn) radioStatus(l.length > 1 ? 'Sender ' + (radioIdx + 1) + ' von ' + l.length : 'Zum Abspielen tippen');
  }
  function radioStart() {
    clearTimeout(radioNeu);
    radioAn = true; radioZeigen(); radioStatus('Verbinde …');
    audio.src = sender()[radioIdx].url;
    var versuch = ++radioVersuch;
    var p = audio.play();
    // Nur der letzte Versuch zählt; ein Senderwechsel bricht den alten play() mit AbortError ab.
    if (p && p.catch) p.catch(function (e) {
      if (versuch !== radioVersuch || (e && e.name === 'AbortError')) return;
      radioAn = false; radioZeigen(); radioStatus('Zum Abspielen tippen'); spieltSetzen(false);
    });
  }
  function radioStop() {
    clearTimeout(radioNeu); radioVersuch++;
    radioAn = false; audio.pause(); audio.removeAttribute('src'); audio.load();
    spieltSetzen(false); radioZeigen();
  }
  function radioWechsel(r) {
    var l = sender(); radioIdx = (radioIdx + r + l.length) % l.length; LS.set('radioIdx', radioIdx);
    if (radioAn) radioStart(); else radioZeigen();
  }
  audio.addEventListener('playing', function () { spieltSetzen(true); radioStatus('Live'); });
  audio.addEventListener('waiting', function () { if (radioAn) radioStatus('Verbinde …'); });
  audio.addEventListener('error', function () {
    if (!radioAn) return;
    spieltSetzen(false); radioStatus('Unterbrochen, neuer Versuch …');
    clearTimeout(radioNeu); radioNeu = setTimeout(radioStart, 5000);
  });
  $('rPlay').addEventListener('click', function () { radioAn ? radioStop() : radioStart(); });
  $('dsRPlay').addEventListener('click', function () { radioAn ? radioStop() : radioStart(); });
  $('dsRWeiter').addEventListener('click', function () { radioWechsel(1); });
  $('dsRadio').addEventListener('click', function (e) { if (!document.body.classList.contains('gece')) e.stopPropagation(); });
  $('rZurueck').addEventListener('click', function () { radioWechsel(-1); });
  $('rWeiter').addEventListener('click', function () { radioWechsel(1); });
  // Tippen auf das Radio soll nicht den Foto-Modus auslösen.
  function spieltSetzen(an) { $('radio').classList.toggle('spielt', an); $('dsRadio').classList.toggle('spielt', an); }
  $('radio').addEventListener('click', function (e) { if (!document.body.classList.contains('gece')) e.stopPropagation(); });

  /* ---------- Dokunma: gece uyandır, gündüz sadece foto ---------- */
  var sadeceFotoZ = null;
  document.addEventListener('click', function (ev) {
    if (!$('kurulum').hidden) return;
    if (document.body.classList.contains('gece')) { uyanikBitis = Date.now() + 60000; document.body.classList.remove('gece', 'aus'); return; }
    if (!fotoSira.length || document.body.classList.contains('diashow')) return;
    $('tamFoto').style.backgroundImage = $(aktif).style.backgroundImage;
    var b = document.body.classList.toggle('sadeceFoto');
    clearTimeout(sadeceFotoZ);
    if (b) sadeceFotoZ = setTimeout(function () { document.body.classList.remove('sadeceFoto'); }, 30000);
  });

  /* ---------- Ekran koruma: hafif kaydırma ---------- */
  setInterval(function () {
    $('pano').style.transform = 'translate(' + (Math.random() * 10 - 5).toFixed(1) + 'px,' + (Math.random() * 10 - 5).toFixed(1) + 'px)';
  }, 10 * 60000);

  /* ---------- Demo verisi ---------- */
  function demoVeri() {
    var s = new Date();
    function t(gun, sa, dk) { var d = new Date(s.getFullYear(), s.getMonth(), s.getDate() + gun, sa, dk); return d.toISOString(); }
    function g(gun) { var d = new Date(s.getFullYear(), s.getMonth(), s.getDate() + gun); return d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate()); }
    var lay = null; try { lay = JSON.parse(q.get('lay')); } catch (e) {}
    return {
      layout: lay || undefined,
      modus: q.get('modus') || 'standard',
      optionen: q.get('zeit') ? { zeit_aktiv: true, zeit_an: q.get('zeit').split('-')[0], zeit_aus: q.get('zeit').split('-')[1] } : (q.has('deko') ? { deko_weihnacht: q.get('deko') !== '0' } : {}),
      sehir: 'Köln',
      etkinlikler: [
        { t: 'Sellbird Teammeeting', g: false, b: t(0, s.getHours(), 0), s: t(0, s.getHours() + 1, 0), r: '#7aa2ff' },
        { t: 'Abendessen', g: false, b: t(0, 19, 30), s: t(0, 21, 0), r: '#ff8fa3' },
        { t: 'Steuerberater', g: false, b: t(1, 10, 0), s: t(1, 11, 0), r: '#7ee0b5' },
        { t: 'Urlaub', g: true, b: g(3), s: g(6), r: '#ffd27a' },
        { t: 'Zahnarzt', g: false, b: t(8, 14, 15), s: t(8, 15, 0), r: '#c7a6ff' }
      ],
      notlar: ['Versandetiketten drucken', 'Rechnungen prüfen', 'Einkaufen: Milch, Brot', 'iPad-Ladekabel kaufen'],
      sayimlar: [{ ad: 'Silvester', tarih: s.getFullYear() + '-12-31', yillik: true }, { ad: 'Urlaub', tarih: g(3), yillik: false }, { ad: 'Geburtstag', tarih: g(19), yillik: true }],
      fotolar: ['https://picsum.photos/id/1027/720/1280', 'https://picsum.photos/id/1015/1200/800', 'https://picsum.photos/id/1043/1200/800', 'https://picsum.photos/id/1067/1200/800']
    };
  }

  /* ---------- Başlat ---------- */
  function kurulumGoster() {
    $('kurulum').hidden = false; $('pano').style.opacity = .15;
    $('kApi').value = API;
    $('kurulumForm').addEventListener('submit', function (e) {
      e.preventDefault();
      var k = $('kKey').value.trim();
      LS.set('api', $('kApi').value.trim()); LS.set('k', k); LS.set('demo', false); keksSetzen(k);
      location.replace(location.pathname + '?k=' + encodeURIComponent(k));
    });
    $('kDemo').addEventListener('click', function () { LS.set('demo', true); location.replace(location.pathname); });
  }

  saatGuncelle();
  if (!DEMO && (!API || !KEY)) { kurulumGoster(); return; }

  ciz();
  var eskiHava = LS.get('hava'); if (eskiHava) havaCiz(eskiHava);
  veriYukle().then(havaYukle);
  setInterval(veriYukle, AYAR.veriDk * 60000);
  setInterval(havaYukle, AYAR.havaDk * 60000);
  setInterval(versionPruefen, 10 * 60000);
  setTimeout(function () { if (navigator.onLine !== false && !radioAn) location.reload(); }, AYAR.yenidenYukleSaat * 36e5);
})();
